apiVersion: v1
kind: Pod
metadata:
  name: memory-request-demo
  namespace: training
spec:
  restartPolicy: Never
  containers:
    - name: demo
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
