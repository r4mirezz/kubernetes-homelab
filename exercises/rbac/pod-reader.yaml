apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
  namespace: training
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: training
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
  namespace: training
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: training
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
