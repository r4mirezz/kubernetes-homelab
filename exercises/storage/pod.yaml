apiVersion: v1
kind: Pod
metadata:
  name: storage-demo
  namespace: training
spec:
  restartPolicy: Never
  containers:
    - name: storage-demo
      image: busybox:1.37
      command: ["sleep", "86400"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
      volumeMounts:
        - name: ticket-data
          mountPath: /data
  volumes:
    - name: ticket-data
      persistentVolumeClaim:
        claimName: storage-demo-pvc
