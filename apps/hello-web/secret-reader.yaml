apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
  namespace: training
spec:
  restartPolicy: Never
  containers:
    - name: reader
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          if [ -s /var/run/secrets/practice/api-token ]; then
            echo "Secret file exists and is not empty"
          else
            echo "Secret file missing or empty"
            exit 1
          fi
      volumeMounts:
        - name: api-token
          mountPath: /var/run/secrets/practice
          readOnly: true
  volumes:
    - name: api-token
      secret:
        secretName: practice-api
