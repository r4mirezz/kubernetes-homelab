apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-desk
  namespace: training
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: support-desk
  template:
    metadata:
      labels:
        app: support-desk
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: support-desk
          image: ghcr.io/r4mirezz/support-desk@sha256:02ecb2901a96837c1878916ae3e18c1cfcdf56a9984248606074585d75d56e09
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: support_desk
            - name: PGUSER
              value: support_desk_app
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: support-desk-db
                  key: PGPASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 10
